services:
  app:
    container_name: diini-real-estate-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
        NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID: ${NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID:-}
        NEXT_PUBLIC_META_GRAPH_VERSION: ${NEXT_PUBLIC_META_GRAPH_VERSION:-v23.0}
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      - app_internal
      - proxy
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  scheduler:
    container_name: diini-real-estate-scheduler
    image: diini-real-estate-app:latest
    env_file:
      - .env.production
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        backup_day="";
        while true; do
          echo "[$$(date -Iseconds)] Running follow-up worker";
          wget -qO- --timeout=20 --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/follow-ups || echo "[$$(date -Iseconds)] Follow-up worker request failed";
          echo "[$$(date -Iseconds)] Running subscription expiry worker";
          wget -qO- --timeout=20 --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/subscriptions || echo "[$$(date -Iseconds)] Subscription worker request failed";
          echo "[$$(date -Iseconds)] Running push notification worker";
          wget -qO- --timeout=30 --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/push || echo "[$$(date -Iseconds)] Push notification worker request failed";
          echo "[$$(date -Iseconds)] Running platform alert monitor";
          wget -qO- --timeout=30 --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/platform-alerts || echo "[$$(date -Iseconds)] Platform alert monitor request failed";
          current_day=$$(date -u +%F);
          if [ "$$current_day" != "$$backup_day" ]; then
            filename="diini-backup-$${current_day}.bin";
            echo "[$$(date -Iseconds)] Generating encrypted daily backup $$filename";
            if wget -qO "/backups/.$$filename.tmp" --timeout=180 --header="Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/cron/backups?filename=$$filename"; then
              mv "/backups/.$$filename.tmp" "/backups/$$filename";
              wget -qO- --post-data="" --timeout=20 --header="Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/cron/backups?filename=$$filename" || echo "[$$(date -Iseconds)] Backup confirmation failed";
              find /backups -type f -name 'diini-backup-*.bin' -mtime +14 -delete;
              backup_day="$$current_day";
            else
              rm -f "/backups/.$$filename.tmp";
              echo "[$$(date -Iseconds)] Encrypted daily backup failed";
            fi;
          fi;
          echo;
          sleep 60;
        done
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_internal
    restart: unless-stopped
    init: true
    mem_limit: 128m
    cpus: 0.10
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./backups:/backups

networks:
  app_internal:
    name: diini_real_estate_internal
    internal: true
  proxy:
    external: true
    name: proxy_default

